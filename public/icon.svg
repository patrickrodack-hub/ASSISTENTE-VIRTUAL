<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#111C2D" />
      <stop offset="65%" stop-color="#080C14" />
      <stop offset="100%" stop-color="#04070C" />
    </radialGradient>
    <linearGradient id="jarvisGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A" />
      <stop offset="50%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#B45309" />
    </linearGradient>
    <linearGradient id="fridayCyan" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284C7" />
      <stop offset="50%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#BAE6FD" />
    </linearGradient>
    <linearGradient id="ultronRed" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#EF4444" />
      <stop offset="100%" stop-color="#991B1B" />
    </linearGradient>
  </defs>

  <!-- Full-bleed dark titanium background -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />

  <!-- Outer Jarvis Gold Telemetry Ring (Safe Zone within 80%) -->
  <circle
    cx="256"
    cy="256"
    r="168"
    fill="none"
    stroke="url(#jarvisGold)"
    stroke-width="10"
    stroke-dasharray="44 18 16 18"
  />

  <!-- Middle Friday Cyan Tactical Ring -->
  <circle
    cx="256"
    cy="256"
    r="132"
    fill="none"
    stroke="url(#fridayCyan)"
    stroke-width="8"
    stroke-dasharray="68 24"
  />

  <!-- Inner Ultron Crimson Sentinel Ring -->
  <circle
    cx="256"
    cy="256"
    r="98"
    fill="none"
    stroke="url(#ultronRed)"
    stroke-width="6"
    stroke-dasharray="28 14"
  />

  <!-- Stark Arc Reactor Geometric Core -->
  <polygon
    points="256,172 328,214 328,298 256,340 184,298 184,214"
    fill="#0B1322"
    stroke="url(#fridayCyan)"
    stroke-width="6"
  />

  <circle cx="256" cy="256" r="46" fill="url(#fridayCyan)" opacity="0.22" />
  <circle cx="256" cy="256" r="32" fill="url(#jarvisGold)" />
  <circle cx="256" cy="256" r="16" fill="#FFFBEB" />
</svg>
